[tool.poetry]
name = "biodoe"
version = "0.0.1"
description = "Design-of-experiments for nonlinear biological systems."
authors = ["Yuji Okano <yujiokano@keio.jp>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
matplotlib = "^3.11.1"
seaborn = "^0.13.2"
numpy = "^2.5.3"
statsmodels = "^0.15.0"
pydoe = "^1.5.0"
rpy2 = "^3.6.7"
scikit-learn = "^1.9.0"
anndata = "^0.13.3.post0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.3.0"
ipywidgets = "^8.1.9"
jupyterlab = "^4.6.3"
jupyter-resource-usage = "^1.3.0"
pytest = "^9.1.1"
mypy = "^2.3.1"
ruff = "^0.16.6"
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.1.0"
sphinx-gallery = "^0.21.0"
nbsphinx = "^0.9.8"
numpydoc = "^1.10.0"
myst-parser = "^5.1.0"
pandoc = "^2.4"
polars = "^1.44.2"
pyarrow = "^25.0.1"
pyyaml = "^6.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["biodoe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "-v", "--durations=10"]
testpaths = [
    "tests",
    "biodoe_tools",
]
norecursedirs = [".ipynb_checkpoints", "docs", "renv", ".venv", ".git", ".github"]
